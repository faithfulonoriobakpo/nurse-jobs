name: Find nursing jobs

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 07:00 UK summer time / 06:00 winter
  workflow_dispatch:       # "Run workflow" button on the Actions tab

permissions:
  contents: write          # commit the seen/cache files back so "New" works across runs
  pages: write
  id-token: write

concurrency:
  group: find-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search jobs and build dashboard
        run: python find_jobs.py
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/seen.json output/cache/cos.json output/cache/postcodes.json
          if ! git diff --cached --quiet; then
            git commit -m "Update job state"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/dashboard
      - id: deploy
        uses: actions/deploy-pages@v4
